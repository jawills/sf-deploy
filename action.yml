name: Salesforce Metadata Deploy
description: Builds and deploys metadata to a specified environment
author: jawills
branding:
  icon: code
  color: blue
inputs:
  DRY_RUN:
    description: "Validate deploy and run Apex tests but don't save to the org."
    type: boolean
  TEST_LEVEL:
    description: "Deployment Apex testing level."
    type: choice
    default: RunLocalTests
    options:
      - NoTestRun
      - RunSpecifiedTests
      - RunLocalTests
      - RunAllTestsInOrg
      - RunRelevantTests
  WAIT:
    description: "Number of minutes to wait for command to complete and display results."
    type: number
    default: 30
  SOURCE_DIRECTORY:
    description: "Path to the local source files to deploy."
    type: string
    default: force-app
  MANIFEST_PATH:
    description: "If set, deploy this manifest instead of generating one from SOURCE_DIRECTORY."
    type: string
  POST_DESTRUCTIVE_CHANGES:
    description: "If set, passed to sf project deploy start as --post-destructive-changes."
    type: string
  SFDX_AUTH_URL:
    description: "The auth url tied to your deployment environment"
    type: string
    required: true
  DEPLOYMENT_ID:
    description: "The deployment id from a validation/ dry run."
    type: string

outputs:
  deployment_id:
    description: "Salesforce deployment job id."
    value: ${{ steps.deploy_resume.outputs.deployment_id }}
  deploy_status:
    description: "Deployment status reported by the CLI (e.g. Succeeded, Failed)."
    value: ${{ steps.deploy_resume.outputs.deploy_status }}

runs:
  using: "composite"
  steps:
    - name: Install Salesforce CLI
      shell: bash
      run: |
        npm install -g @salesforce/cli
        sf --version
    - name: Login to Environment
      shell: bash
      run: |
        sf org login sfdx-url --set-default --sfdx-url-file <(echo "${{ inputs.SFDX_AUTH_URL }}")
    - name: Generate package.xml
      if: ${{ inputs.MANIFEST_PATH == '' }}
      shell: bash
      run: |
        sf project generate manifest --source-dir ${{ inputs.SOURCE_DIRECTORY }} --output-dir manifest
    - name: Start deployment
      shell: bash
      run: |
        if [ -n "${{ inputs.MANIFEST_PATH }}" ]; then
          manifest="${{ inputs.MANIFEST_PATH }}"
        else
          manifest="manifest/package.xml"
        fi
        deployFlags=(
            --manifest "$manifest"
            --test-level ${{ inputs.TEST_LEVEL }}
            --verbose
            --async
            --json
          )
        if [ "${{ inputs.DRY_RUN }}" = "true" ]; then
          deployFlags+=( --dry-run )
        fi
        if [ -n "${{ inputs.DEPLOYMENT_ID }}" ]; then
          deployFlags+=( --job-id ${{ inputs.DEPLOYMENT_ID }} )
        fi
        if [ -n "${{ inputs.POST_DESTRUCTIVE_CHANGES }}" ]; then
          deployFlags+=( --post-destructive-changes "${{ inputs.POST_DESTRUCTIVE_CHANGES }}" )
        fi
        sf project deploy start "${deployFlags[@]}" > run.json
        jq -r '.result.id' run.json > deployment-id.txt
    - name: Resume Deployment
      id: deploy_resume
      shell: bash
      run: |
        set +e
        sf project deploy resume -i "$(cat deployment-id.txt)" --wait ${{ inputs.WAIT }} --json > resume-result.json
        resume_rc=$?
        set -e

        deployment_id="$(jq -r '.result.id // empty' resume-result.json 2>/dev/null || true)"
        if [ -z "$deployment_id" ]; then
          deployment_id="$(cat deployment-id.txt)"
        fi
        deploy_status="$(jq -r '.result.status // empty' resume-result.json 2>/dev/null || true)"
        if [ -z "$deploy_status" ]; then
          deploy_status="$(jq -r '.status // "Unknown"' resume-result.json 2>/dev/null || true)"
        fi
        num_deployed="$(jq -r '.result.numberComponentsDeployed // empty' resume-result.json 2>/dev/null || true)"
        num_failed="$(jq -r '.result.numberComponentErrors // empty' resume-result.json 2>/dev/null || true)"
        check_only="$(jq -r '.result.checkOnly // false' resume-result.json 2>/dev/null || true)"

        {
          echo "## Deployment summary"
          echo ""
          echo "| Field | Value |"
          echo "| --- | --- |"
          echo "| Deployment ID | \`$deployment_id\` |"
          echo "| Status | **$deploy_status** |"
          [ -n "$num_deployed" ] && echo "| Components deployed | $num_deployed |"
          [ -n "$num_failed" ] && echo "| Component errors | $num_failed |"
          echo "| Check only (validate) | $check_only |"
        } >> "$GITHUB_STEP_SUMMARY"

        failures_json="$(jq -c '.result.details.componentFailures // empty' resume-result.json 2>/dev/null || true)"
        if [ -n "$failures_json" ] && [ "$failures_json" != "null" ] && [ "$failures_json" != "[]" ]; then
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Component failures" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          jq '.result.details.componentFailures' resume-result.json >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
        fi

        {
          echo "deployment_id<<EOF"
          echo "$deployment_id"
          echo "EOF"
          echo "deploy_status<<EOF"
          echo "$deploy_status"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

        exit "$resume_rc"
